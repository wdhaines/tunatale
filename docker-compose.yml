# ⚠️ ONE compose file for dev and the box, on purpose. A second prod-only copy
# would drift from this one silently, and the drift would surface as a
# production-only bug.
#
# `image:` is what the box pulls; `build:` is what a laptop uses. With both
# present, `docker compose pull` fetches the pinned tag and `up -d` runs it
# without building. TT_TAG is a full commit SHA, written into `.env` beside this
# file by deploy.sh (compose interpolates that file automatically).
#
# TT_TAG has NO default, and `:?` makes compose refuse rather than invent one.
# A `:-latest` fallback would mean a mistyped deploy silently ships whatever
# "latest" happens to be — the exact "which code is actually running?" question
# a tagged deploy exists to answer. On a laptop, `docker compose build` and
# `up --build` still work: set TT_TAG=dev, or export it once.
services:
  init:
    image: ghcr.io/wdhaines/tunatale-api:${TT_TAG:?set TT_TAG to a commit SHA (deploy.sh writes it)}
    build:
      context: .
      target: api
    platform: linux/amd64
    user: root
    volumes:
      - data:/data
    entrypoint:
      - sh
      - -c
      - |
        mkdir -p /data/media /data/output/audio /data/.tunatale/logs
        UV_CACHE_DIR=/data/.uv-cache uv run --isolated --no-project --python 3.14 --with anki python -c "import anki; print('pre-warmed')"
        chown -R appuser:appuser /data

  api:
    # Same image as `init` by construction: init is this image with a different
    # entrypoint, so they cannot diverge in what they pre-warm vs what runs.
    image: ghcr.io/wdhaines/tunatale-api:${TT_TAG:?set TT_TAG to a commit SHA (deploy.sh writes it)}
    build:
      context: .
      target: api
    platform: linux/amd64
    # The box installs security updates unattended and REBOOTS for kernel ones
    # (docs/deployment.md § Provisioning, step 5). Without a restart policy
    # every such reboot ends with docker up and TunaTale down until someone
    # notices — which fails the one uptime requirement the design states,
    # "recovers without me". Deliberately NOT on `init`: it is a run-once job
    # gated by service_completed_successfully, and restarting it would loop.
    restart: unless-stopped
    env_file: backend/.env
    environment:
      HOME: /data
      MEDIA_DIR: /data/media
      AUDIO_DIR: /data/output/audio
      DATABASE_URL: sqlite:////data/tunatale_sl.db
      DATABASE_URLS: '{"sl": "sqlite:////data/tunatale_sl.db", "no": "sqlite:////data/tunatale_no.db"}'
      LEMMATIZER_TYPE: lowercase
      UV_CACHE_DIR: /data/.uv-cache
    volumes:
      - data:/data
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      # 90s, measured, NOT the 15s this used to be. Failures inside
      # start_period do not count toward `retries`; after it they do, and three
      # at 10s apart flip the container to `unhealthy`.
      #
      # On the e2-micro (0.25 vCPU baseline) the app binds in ~18s from a warm
      # deploy but took ~70s after a full VM REBOOT, when docker, containerd and
      # every service start at once: measured 2026-09-11, three checks at
      # exit=7 (connection refused) before the first success. So the box came
      # back on its own and served HTTP 200 while reporting `unhealthy` — which
      # is worse than a slow start, because that is the signal a deploy script
      # or an uptime monitor acts on. It is also what made a working deploy
      # report failure (tunatale-pse).
      start_period: 90s

  web:
    image: ghcr.io/wdhaines/tunatale-web:${TT_TAG:?set TT_TAG to a commit SHA (deploy.sh writes it)}
    build:
      context: .
      target: web
    # ⚠️ Deliberately NOT pinned to linux/amd64, unlike api/init above.
    # Caddy is a Go binary and SEGVs under this Mac's QEMU amd64 emulation —
    # a panic in crypto/x509.parseCertificate inside x509roots/fallback's init,
    # before it serves anything. Pinning it here makes `docker compose up`
    # unusable on an arm64 dev machine for no production benefit: on the GCP
    # host and on a CI runner, native IS amd64.
    # The amd64 guarantee for the SHIPPED artifact therefore belongs to the
    # build command (`docker build --platform linux/amd64`) and to tunatale-pse,
    # not to this file. Do not "fix" this by adding a platform key — verify the
    # reasoning in tunatale-014's notes first.
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  data:
