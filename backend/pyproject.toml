[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tunatale-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "edge-tts>=7.2.8",
    "soundfile>=0.14.0",
    "aiofiles>=25.1.0",
    "numpy>=2.5.2",
    "wordfreq>=3.1.1",
    "argon2-cffi>=25.1.0",
]

[project.optional-dependencies]
# Anki sync engine. Optional + sync-only: imported ONLY in app/plugins/anki_sync/sync_driver.py,
# which runs in a `uv run --with anki` subprocess. A no-sync user never installs it;
# neither a plain `uv sync` nor `--all-groups` pulls it (extra, not group). The
# runtime version is pinned via the `anki_pkg_version` setting (empty → latest), not
# here, so this stays a valid specifier regardless of which desktop Anki the user runs.
anki = ["anki"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    # NOTE: no `pre-commit` here on purpose. The pre-commit gate in this repo is
    # `./test.sh` (invoked by the Claude Code commit-gate hook), not the
    # pre-commit framework — there is no .pre-commit-config.yaml anywhere in the
    # tree, so the package was an unused dependency and was dropped 2026-07-25.
    # Don't re-add it without also adding a config that something actually runs.
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "respx>=0.23.1",
    "ruff>=0.16.5",
    "anyio>=4.14.2",
    # Dev-server reload backend. We depend on plain `uvicorn` (not
    # `uvicorn[standard]`, which would also drag in httptools/uvloop/websockets we
    # don't want), and without watchfiles uvicorn silently falls back to StatReload
    # — an os.stat() sweep of every watched file every 0.25s. On this tree that
    # idled at ~59% of a core (measured 2026-07-26); watchfiles uses FSEvents
    # instead and idles at ~0%. Dev-only: nothing under app/ imports it, and
    # `--reload` is only ever passed by start-dev.sh.
    "watchfiles>=1.2.0",
    # Bit-exact precision oracle for TT's FSRS math (tests/test_parity_fsrs_f32.py,
    # test_parity_same_day_review.py, …).
    #
    # ⚠️ HELD at <0.9 from 2026-07 to 2026-08-31, then RELEASED — read this before
    # re-pinning it. The hold existed because 0.9.x made the same-day HARD
    # short-term stability non-decreasing (SInc(Hard)), which was AHEAD of the
    # desktop Anki TT mirrors: 0.8.2 and TT both returned 99.4537 where 0.9.x
    # returned 132.667. Adopting 0.9.x then would have put the precision oracle
    # ahead of the binary we sync with.
    #
    # Desktop Anki 26.08.1 adopted that formula (26.05 had not — measured by
    # running the parity suite against both via ANKI_PKG_VERSION). So the
    # relationship inverted: 0.8.x is now the one that disagrees with Anki, and
    # 0.9.x is the correct oracle. TT's `_stability_short_term` moved in the same
    # commit. The cap is gone because the condition it guarded is gone; if a
    # future fsrs release again runs ahead of desktop Anki, re-cap it and say
    # which Anki version is the reference.
    "fsrs-rs-python>=0.9.3",
]
# Per-language morphological analyzers (sentence-aware lemmas + A1 morphology
# features), split into per-language dependency groups: classla for Slovene,
# stanza for Norwegian (Bokmål/Nynorsk; stanza is the upstream project classla
# forks). Both are DEFAULT dependency groups (see `[tool.uv] default-groups`
# below), NOT extras — so every plain `uv sync`, `uv sync --all-groups`, or
# the implicit sync inside `uv run` installs both.
#
# ⚠️ CI IS NOT PyTorch-FREE, despite what this comment said until 2026-08-18.
# It claimed CI opted out with `--no-group slovene --no-group norwegian`. Those
# flags were DELETED on 2026-08-14 (tunatale-as5) because they did nothing: a
# bare `uv run` re-syncs to `default-groups` below and puts everything straight
# back. So CI installs torch, and has since long before the flags went. The
# reasoning, the proof, and the note that `default-groups`/`--no-sync` is the
# actual lever are in `.github/workflows/ci.yml` above `jobs:` — read that
# rather than re-deriving it.
#
# What running fat costs, measured 2026-08-18 on run 32189295215: the restored
# uv cache is **2.5 GB** and the `Install uv` step is **~103s per job** (~80s
# downloading at 31-43 MB/s, ~21s untarring), across 7 jobs. That is now the
# largest single setup cost in CI — bigger than the ffmpeg install it sits
# next to. Nobody had measured it, which is why nothing had weighed the
# divergence a lean CI would create against a number.
# classla 2.2.1 pins torch<=2.6 / protobuf==4.21.2, neither of which has a
# cp314 wheel; the `[tool.uv] override-dependencies` below forces 3.14-capable
# builds. Models still download once per engine: `classla.download("sl")` /
# `stanza.download("nb")`. See docs/walkthrough.md §22.2.
slovene = [
    "classla==2.2.1",
]
norwegian = [
    "stanza",
]
# Forced-alignment models for syllable slicing (app/plugins/languages/no/alignment.py).
# A DEFAULT dependency group (see `[tool.uv] default-groups` below), so a plain
# `uv sync` produces a slicing-capable environment with no flags to remember.
# ⚠️ CI does NOT opt out of this, despite what this comment said until
# 2026-08-18 — the `--no-group alignment` flag it named was deleted on
# 2026-08-14 with the others, for the same reason (see the block above the
# slovene group, and ci.yml above `jobs:`). transformers IS installed in CI,
# and the e2e job's own log proves the capability is live: it prints
# `Syllable slicing enabled for: no`, which is guarded by `if slicers:` and
# cannot print in a transformers-free environment.
# Gated at runtime by `app.audio.slicer.alignment_installed()`.
# Separate from norwegian/stanza because morphology and forced alignment are
# different capabilities that happen to share torch today. (The original second
# half of this sentence — "and CI's opt-out list stays readable as a list of
# capabilities it declines" — described an opt-out list that no longer exists.)
alignment = ["transformers>=5.16.1"]

[tool.uv]
# The slovene/norwegian/alignment groups are DEFAULT groups, so a bare
# `uv sync`, `uv sync --all-groups`, and the implicit sync inside `uv run` all
# install them — a working dev env is the default, with no flags to remember.
# ⚠️ CI does NOT stay PyTorch-free. This comment used to claim it did, via
# `uv sync --all-groups --no-group slovene --no-group norwegian --no-group
# alignment`; those flags were deleted 2026-08-14 (tunatale-as5) as inert, and
# CI runs a plain `uv sync --all-groups`. The `anki` extra is separate (not a group) —
# pulled only by the `uv run --with anki` driver subprocess, never by these
# syncs.
default-groups = ["dev", "slovene", "norwegian", "alignment"]
# Two 3.14 pin-overrides for the slovene/norwegian groups. These are LIVE, not
# inert: an earlier version of this comment called them "inert unless
# torch/protobuf are actually pulled — CI's `--no-group ...` run never resolves
# them", which stopped being true when those flags were deleted 2026-08-14.
# Every CI job resolves them today.
#   torch:    classla 2.2.1 pins torch<=2.6, which has no cp314 wheel — torch only
#             gained 3.14 support at 2.12.
#   protobuf: classla 2.2.1 pins protobuf==4.21.2, whose google._upb C extension has
#             no cp314 wheel and dies with "Metaclasses with custom tp_new are not
#             supported" at import. classla tolerates it (imports protobuf lazily);
#             `import stanza` does NOT (it eagerly pulls google.protobuf via its
#             CoreNLP server bindings), so stanza needs a 3.14-capable protobuf.
#   requests: classla 2.2.1 also hard-pins requests==2.28.0 (2022), which strands
#             urllib3 at 1.26.20 and charset-normalizer at 2.0.12 across the whole
#             lock. Nothing in app/ imports requests; classla touches it in exactly
#             two places — `requests.get(url, stream=True)` for model downloads
#             (resources/common.py) and the CoreNLP server client we never use
#             (server/client.py). That API surface is unchanged from 2.28 to 2.34,
#             so the pin is staleness, not a compatibility constraint. Carries the
#             [socks] extra: an override REPLACES the requirement it matches, so a
#             bare `requests>=…` would silently drop the PySocks that anki's own
#             `requests[socks]` asks for (the isolated `uv run --with anki` driver
#             subprocess resolves separately and is unaffected either way, but the
#             lock should still say what anki actually declares).
override-dependencies = ["torch==2.13.0", "protobuf>=5.29", "requests[socks]>=2.34.2"]

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (import ordering)
    "UP",    # pyupgrade (modernize syntax)
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
# Pin both first-party roots. Without "scripts", ruff auto-detects it racily
# (first-party vs third-party), so the required order of `from scripts` vs
# `from app` imports flip-flops and I001 fires intermittently in CI.
known-first-party = ["app", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    # Surface ResourceWarnings (unclosed DB connections, files, etc.) so leaks are caught,
    # but ignore the "unclosed event loop" emitted during GC by pytest-asyncio's per-test
    # loop teardown (pytest_asyncio/plugin.py) — plugin-internal, not a project leak.
    "default::ResourceWarning",
    "ignore:unclosed event loop:ResourceWarning",
    # Third-party file-handle leak: reldi_tokeniser (a classla tokenizer dependency) opens
    # abbrev/punct files at import without closing them. Unfixable by us, and only present
    # when the optional `classla` extra is installed locally (never in CI). Listed LAST so
    # it takes precedence over default::ResourceWarning above (pytest inserts each filter
    # at the front, so the final entry wins).
    "ignore::ResourceWarning:reldi_tokeniser",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    # Retired one-shot migration/repair/analysis scripts now live under
    # scripts/anki_archive/ (outside source=["app"]), so they need no omit here.
    # See scripts/anki_archive/__init__.py.
    "app/srs/build_function_word_list.py",
    "app/plugins/anki_sync/sync_driver.py",
    # CLI audio-preview glue: pure TTS-process + filesystem I/O. Testable logic
    # lives in norwegian_breakdown / breakdown_preview (both fully covered).
    "app/plugins/languages/no/breakdown_audio.py",
    # Thin transformers/torch adapter for forced alignment. Omitted because NO
    # TEST MAY DOWNLOAD A ~1.2 GB MODEL — that is the whole justification, and
    # it holds everywhere including CI.
    #
    # ⚠️ It used to read "(CI runs torch-free via --no-group ...)", which is
    # FALSE and has been since those flags were deleted 2026-08-14: torch and
    # transformers are both installed in every CI job. Do not read torch's
    # presence as a reason to un-omit this file — the blocker is the model
    # download, not the import. Un-omitting would make the suite fetch 1.2 GB
    # per run, or fail.
    #
    # It holds no decisions; the Viterbi, the frame->sample
    # mapping and every fallback live in app/audio/alignment.py and app/audio/slicer.py,
    # both covered by model-free tests.
    "app/plugins/languages/no/alignment.py",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
