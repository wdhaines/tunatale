name: CI

on:
  push:
  pull_request:

# Pinned workflow-wide, to the SAME value test.sh pins, so a future job cannot
# silently reintroduce the divergence by forgetting it. See test.sh for why;
# `backend-hostile-tz` deliberately overrides this and is the only job that
# should. Reproducibility comes from the pin, tolerance from that job.
env:
  TZ: UTC

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0  # exact: astral-sh stopped publishing floating major tags after v7 (no v8/v9 alias exists)
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-groups --no-group slovene --no-group norwegian --no-group alignment

      - name: Lint
        run: uv run ruff check app tests scripts

      - name: Format check
        run: uv run ruff format --check app tests scripts

      - name: Mock boundary check
        run: uv run python scripts/check_mock_boundaries.py

      - name: Language literal check
        run: uv run python scripts/check_language_literals.py

      - name: Date today check
        run: uv run python scripts/check_date_today.py

      - name: Singular database_url check
        run: uv run python scripts/check_singular_database_url.py

      - name: Plugin import check
        run: uv run python scripts/check_plugin_imports.py

      - name: OpenAPI snapshot check
        run: uv run python scripts/check_openapi_snapshot.py

      - name: Prod env profile check
        run: uv run python scripts/check_prod_env.py

      - name: Test
        run: uv run pytest -n auto

  # Runs the backend suite at a deliberately hostile UTC offset, because pinning
  # TZ everywhere else makes both gates blind to time-zone fragility rather than
  # free of it.
  #
  # This is not hypothetical. A /listen rollover fixture mixed UTC literals with
  # locally-derived Anki-day bounds and failed from UTC+5 eastward; local (-0400)
  # and CI (UTC) both sat inside the passing band, so it survived every gate
  # until someone went looking (tunatale-3oz).
  #
  # UTC+14 is the maximal probe — Kiritimati is the furthest-forward zone that
  # exists, so a suite green here is green at every offset. It is a separate job
  # rather than a matrix dimension on `backend` so it runs in parallel and adds
  # no wall-clock time, and --no-cov because `backend` already owns the coverage
  # gate; this job exists to answer one question only.
  #
  # ⚠️ If this goes red while `backend` is green, the bug is a test that encodes
  # a local wall-clock assumption as a UTC literal — look for a fixture doing
  # date arithmetic across ANKI_ROLLOVER_HOUR before suspecting product code.
  backend-hostile-tz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0  # exact: astral-sh stopped publishing floating major tags after v7 (no v8/v9 alias exists)
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-groups --no-group slovene --no-group norwegian --no-group alignment

      - name: Test at UTC+14
        run: uv run pytest -n auto --no-cov
        env:
          TZ: Pacific/Kiritimati

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Format check
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: OpenAPI type check
        run: bun run check:api

      - name: Type check
        run: bun run check

      - name: Unit tests
        run: bun run test:coverage

  oracle-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0  # exact: astral-sh stopped publishing floating major tags after v7 (no v8/v9 alias exists)
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-groups --no-group slovene --no-group norwegian --no-group alignment

      - name: Warm anki subprocess env
        run: uv run --isolated --no-project --python 3.14 --with anki==26.5 python -c "import anki"

      - name: Oracle parity gate
        run: uv run pytest -m oracle --run-oracle -n auto --no-cov

  peer-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0  # exact: astral-sh stopped publishing floating major tags after v7 (no v8/v9 alias exists)
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-groups --no-group slovene --no-group norwegian --no-group alignment

      - name: Warm anki subprocess env
        run: uv run --isolated --no-project --python 3.14 --with anki==26.5 python -c "import anki"

      - name: Peer-sync gate
        run: uv run pytest tests/test_anki_peer_sync_selfhost.py --run-peer-sync --no-cov -v
