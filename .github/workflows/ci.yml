name: CI

# `push` is narrowed to main ON PURPOSE. Unrestricted, it fired alongside
# `pull_request` for every branch push, so any branch with an open PR got TWO
# complete identical runs of all six jobs — doubling CI minutes on every push.
#
# It was not only waste. On PR #19 the redundant run's `backend` job became a
# zombie (43 minutes without finishing step 1, while the identical job in the
# sibling run passed in 1m57s). `gh pr checks` aggregates across runs, so the PR
# showed a permanent `pending` that read as a hanging test suite rather than a
# dead runner on a run that never needed to exist. One run per push makes that
# unambiguous.
#
# Consequence, accepted deliberately: a branch pushed WITHOUT an open PR now gets
# no CI. Confirmed with the user 2026-08-14 that nothing relies on that.
on:
  push:
    branches: [main]
  pull_request:

# Pinned workflow-wide, to the SAME value test.sh pins, so a future job cannot
# silently reintroduce the divergence by forgetting it. See test.sh for why.
# Exactly TWO jobs deliberately override it, and they are the only ones that
# should: `backend-hostile-tz` (varies the OFFSET) and `backend-hostile-hour`
# (varies the local CLOCK). Reproducibility comes from the pin, tolerance from
# those two — and they are orthogonal, so neither substitutes for the other.
env:
  TZ: UTC

# ⚠️ CI NOW RUNS LEAN (tunatale-ouk.6): every backend job installs only
# `--no-default-groups --group dev`, so classla/stanza/torch/transformers are
# NOT installed, and the local/CI divergence this file used to only warn about
# is now real and deliberate. It sticks because each of those jobs sets
# `UV_NO_SYNC: "1"` at JOB level (not a `--no-sync` flag, which does not
# propagate): the suite shells out to a bare `uv run python -c`
# (tests/test_anki_extra_isolation.py) that would otherwise re-sync the env back
# to `[tool.uv] default-groups` MID-RUN and re-fatten it (~140 M -> ~876 M).
# Lean, measured: full suite 6325 passed / 57 skipped / 100.00% coverage, venv
# ~155 M. The failure set for a lean env is empty — byte-identical skip list to
# fat — so a NEW failure or CHANGED skip count is a finding, not a prompt to
# widen the groups. If a post-sync step (a `scripts/check_*.py`, or the NST
# lexicon build) ever needs a package the lean env lacks, that is a separate
# finding to surface by name, not a reason to add a group back here.
#
# ⚠️ THE LEAN INSTALL IS ONLY HALF THE CHANGE, and for a month it was the half
# that did nothing visible. The uv cache key hashes platform + python version +
# LOCKFILE — never the install flags — so shrinking what a job INSTALLS does not
# shrink what it RESTORES. Measured 2026-09-01 across 11 successful main runs:
# the five python jobs restored `Cache Size: ~2517 MB` and spent an `Install uv`
# median of 23-39s, against e2e's ~90 MB and 3s — e2e being the only job that
# had a `cache-suffix`. Same key but for the suffix; save-cache is on, so the fat
# cache was also being re-saved every run. Self-perpetuating until the key moves.
# Hence `cache-suffix: lean-py` on all of them, which orphans the fat cache and
# lets it age out of the repo's cache quota. (It reads as four jobs today, not
# five: oracle-parity and peer-sync were merged into `anki-gates` in the same
# pass — tunatale-ej8.2.)
#
# THE DIAGNOSTIC THAT MATTERS, if this is ever revisited: read the restored
# `Cache Size:` in the job log, NOT the step duration. Duration cannot separate
# "restoring a fat cache" from "a lean cache is simply slow here", and reasoning
# from the step time is how tunatale-ouk.3 spent a month believing caching was
# off (it was on; `enable-cache` defaults to `auto`).
#
# Historical context, kept so no one re-adds the old flags: the `--no-group
# slovene --no-group norwegian --no-group alignment` flags that used to follow
# a plain `uv sync --all-groups` were DELETED on 2026-08-14 because they did
# nothing (tunatale-as5). They looked like they made CI lean, and tunatale-as5
# was filed on the belief that they did — that CI ran without
# classla/stanza/torch/transformers, so the syllable-slicing paths were never
# exercised for real. Measured, that is false: `pyproject.toml` sets
# `[tool.uv] default-groups = ['dev','slovene','norwegian','alignment']`, and a
# bare `uv run` re-syncs the environment to the DEFAULT groups before running
# anything. So the very next step put all of it back.
#
# Proven, not reasoned: after running CI's exact former sync into a throwaway
# env, `find_spec` reported transformers=False torch=False; one bare `uv run`
# then printed `Installed 37 packages` and the same probe reported True/True,
# with `alignment_installed()` flipping to True. The live confirmation is in the
# `e2e` job's own log — the app boots and prints `Syllable slicing enabled for:
# no`, which is guarded by `if slicers:` and therefore cannot print on the empty
# dict the flags were believed to produce.
#
# Net effect of the flags: an extra partial install per job, then a full one.
# They cost time and bought nothing. The real lever is `default-groups` /
# `--no-sync`, and THIS pass pulled it. The `e2e` job deliberately keeps its own
# older spelling (`--no-group …`) and a separate lean cache scope; do not
# harmonise them. See `.claude/rules/testing.md` § "What a green gate means".
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # ⚠️ Required for the lean sync below to STICK, and it must be job-level —
    # a `--no-sync` flag does not propagate to the bare `uv run` the suite
    # shells out to. Full reasoning in the header block (tunatale-ouk.6).
    env:
      UV_NO_SYNC: "1"

    steps:
      - uses: actions/checkout@v7

      # ffmpeg is a hard runtime dep (app/audio/transcode.py,
      # app/cards/media/normalize.py, app/audio/alignment.py) and no test
      # skips without it. Defined ONCE in .github/actions/setup-ffmpeg —
      # five job instances used to each drag the same 94.1 MB dependency
      # closure off an Ubuntu mirror (~470 MB/run) with the step duplicated
      # verbatim in four places.
      - name: Install ffmpeg
        # tunatale-ouk.2: cap the step so a hung mirror cannot eat the job's
        # full 20min and then report as a plain `fail` that reads exactly like
        # a broken build (that misdiagnosis cost real time on 2026-08-18).
        # 6 min, NOT the 2-3 min that issue suggested: the step measured 4m28s
        # on e2e in run 32185315294, so a 3min cap would have reddened CI on
        # the spot.
        #
        # ⚠️ DO NOT tighten this toward the observed 14-35s. An earlier version
        # of this comment said to, and that was wrong. Those numbers are the
        # WARM path (`Need to get 0 B/62.8 MB`); the cap has to survive the COLD
        # one — a bumped cache key, an evicted cache, a new runner image — which
        # still pulls 62.8 MB and, at the 352 kB/s this mirror has actually been
        # measured serving, takes ~3 minutes. A cap sized to the warm path turns
        # every cache miss into a red build.
        timeout-minutes: 6
        uses: ./.github/actions/setup-ffmpeg
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1  # exact: astral-sh stopped publishing floating major tags after v7 (no v8/v9/v10 alias exists)
        with:
          version: "latest"
          # Same fix as the e2e job below/above, extended to this job: the uv
          # cache key hashes platform + python + LOCKFILE, never the install
          # flags, so `--no-default-groups --group dev` shrank what is INSTALLED
          # while this job kept restoring (and re-saving) the pre-lean 2.5 GB
          # cache. Measured 2026-09-01 over 11 main runs: 2517 MB restored here
          # vs 90 MB in e2e, `Install uv` median 23-39s vs 3s.
          cache-suffix: lean-py

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --no-default-groups --group dev

      - name: Build NST lexicon
        run: uv run python scripts/build_nst_lexicon.py build

      - name: Lint
        run: uv run ruff check app tests scripts

      - name: Format check
        run: uv run ruff format --check app tests scripts

      - name: Mock boundary check
        run: uv run python scripts/check_mock_boundaries.py

      - name: Language literal check
        run: uv run python scripts/check_language_literals.py

      - name: Date today check
        run: uv run python scripts/check_date_today.py

      - name: Singular database_url check
        run: uv run python scripts/check_singular_database_url.py

      - name: Plugin import check
        run: uv run python scripts/check_plugin_imports.py

      - name: OpenAPI snapshot check
        run: uv run python scripts/check_openapi_snapshot.py

      - name: Prod env profile check
        run: uv run python scripts/check_prod_env.py

      - name: Test
        run: uv run pytest -n auto

  # Runs the backend suite at a deliberately hostile UTC offset, because pinning
  # TZ everywhere else makes both gates blind to time-zone fragility rather than
  # free of it.
  #
  # This is not hypothetical. A /listen rollover fixture mixed UTC literals with
  # locally-derived Anki-day bounds and failed from UTC+5 eastward; local (-0400)
  # and CI (UTC) both sat inside the passing band, so it survived every gate
  # until someone went looking (tunatale-3oz).
  #
  # ⚠️ THIS JOB PROBED UTC+14 AND UTC-12 UNTIL 2026-08-31, AND THAT WAS WRONG.
  # It ran two instances at the two extreme zones as "prophylactic symmetric
  # coverage" of an offset-regime theory that vnf.6 had already falsified. The
  # extremes were then MEASURED against the one real offset bug this repo has
  # (tunatale-vnf.9): reintroduce the pre-fix form of
  # `test_unbury_idempotent_across_midnight_same_anki_day` (stamp its two naive
  # datetimes `tzinfo=UTC`) and run it across offsets:
  #
  #   UTC (the `backend` job) .......... PASSES  — misses it
  #   Pacific/Kiritimati (UTC+14) ...... PASSES  — the old matrix missed it
  #   Etc/GMT+12 (UTC-12) .............. PASSES  — the old matrix missed it
  #   Etc/GMT-2 / -3 / -4, Europe/Berlin  FAILS  — caught
  #   Etc/GMT-5 (UTC+5), America/New_York PASSES
  #
  # So both old instances were blind to the only offset bug we have ever found,
  # and the populated CEST/Moscow/Gulf band that DOES catch it went unprobed.
  # The job now runs ONE instance inside that band. This is strictly better
  # coverage than the pair it replaced AND one job instance cheaper, which
  # matters because job COUNT drives the CI tail: eight jobs do not all get
  # runners at once and serialize (run-level p90 586s with a max JOB of 125s).
  #
  # Redundancy check before cutting it — `backend-hostile-hour` computes, on
  # every run, a zone whose LOCAL time is inside [04:00, 05:00), so the rollover
  # BAND that originally forced this job into existence is covered there
  # deterministically. That is what makes the extremes droppable rather than
  # merely expensive. The two jobs are still orthogonal: hostile-hour pins the
  # local hour and lets the offset fall where it may, this one pins the offset.
  #
  # The original bug that forced this job into existence: a test
  # seeding revlog timestamps at `now`/`now-1h` straddles the 4 AM Anki-day
  # rollover inside [04:00, 05:00) local, a wall-clock flake that hits every
  # timezone for one hour a day. UTC+14 alone missed it only because the run
  # happened to land outside that band; UTC-12 fails the SAME clock hour
  # (tunatale-vnf.6). So the offsets are not the probe — the band is. If this
  # goes red while `backend` is green, the bug is a test encoding a local
  # wall-clock assumption — look for a fixture doing date arithmetic across
  # ANKI_ROLLOVER_HOUR before suspecting product code.
  #
  # History of the offset bug named above, kept because it is the reason this
  # job's zone is what it is: `test_unbury_idempotent_across_midnight_same_anki_day`
  # expressed two LOCAL wall-clock times as UTC literals 3 hours apart, so a
  # 4 AM local rollover falls between them only at UTC+2, +3 and +4 (found
  # 2026-08-14 by the 27-offset sweep below, fixed in the same commit).
  #
  # ONE FIXED ZONE IS STILL NOT A MAXIMAL PROBE. It is chosen to cover the one
  # band with a demonstrated failure, not to prove the suite is offset-clean.
  # Do not widen this matrix reflexively — a full sweep is a local command, not
  # a CI job — but do not read "green here" as "green everywhere" either. When
  # touching anything that does date arithmetic across ANKI_ROLLOVER_HOUR, run
  # the sweep locally. ~8 min:
  #
  #   cd backend
  #   for o in $(seq -14 12); do
  #     [ "$o" -ge 0 ] && z="Etc/GMT+$o" || z="Etc/GMT-$(( -o ))"
  #     echo "$z $(TZ=$z uv run pytest -n auto --no-cov -q 2>&1 | tail -1)"
  #   done
  #
  # Separate job (not a matrix dimension on `backend`) so it runs in parallel
  # and adds no wall-clock time; --no-cov because `backend` already owns the
  # coverage gate; this job exists to answer one question only.
  backend-hostile-tz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        # ONE zone, in the band that actually catches things — see the
        # 2026-08-31 measurement in the comment above. Etc/GMT-3 is UTC+3 and
        # has NO DST, so the offset this job probes is the same every run;
        # Europe/Berlin also reproduces the bug but swings +1/+2 across the
        # year, which would make the probe's offset a function of the date.
        tz: [Etc/GMT-3]
    defaults:
      run:
        working-directory: backend

    # ⚠️ Required for the lean sync below to STICK, and it must be job-level —
    # a `--no-sync` flag does not propagate to the bare `uv run` the suite
    # shells out to. Full reasoning in the header block (tunatale-ouk.6).
    env:
      UV_NO_SYNC: "1"

    steps:
      - uses: actions/checkout@v7

      # ffmpeg is a hard runtime dep (app/audio/transcode.py,
      # app/cards/media/normalize.py, app/audio/alignment.py) and no test
      # skips without it. Defined ONCE in .github/actions/setup-ffmpeg —
      # five job instances used to each drag the same 94.1 MB dependency
      # closure off an Ubuntu mirror (~470 MB/run) with the step duplicated
      # verbatim in four places.
      - name: Install ffmpeg
        # tunatale-ouk.2: cap the step so a hung mirror cannot eat the job's
        # full 20min and then report as a plain `fail` that reads exactly like
        # a broken build (that misdiagnosis cost real time on 2026-08-18).
        # 6 min, NOT the 2-3 min that issue suggested: the step measured 4m28s
        # on e2e in run 32185315294, so a 3min cap would have reddened CI on
        # the spot. Tighten it once the cache above is landing hits.
        timeout-minutes: 6
        uses: ./.github/actions/setup-ffmpeg
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1  # exact: astral-sh stopped publishing floating major tags after v7 (no v8/v9/v10 alias exists)
        with:
          version: "latest"
          # Same fix as the e2e job below/above, extended to this job: the uv
          # cache key hashes platform + python + LOCKFILE, never the install
          # flags, so `--no-default-groups --group dev` shrank what is INSTALLED
          # while this job kept restoring (and re-saving) the pre-lean 2.5 GB
          # cache. Measured 2026-09-01 over 11 main runs: 2517 MB restored here
          # vs 90 MB in e2e, `Install uv` median 23-39s vs 3s.
          cache-suffix: lean-py

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --no-default-groups --group dev

      - name: Build NST lexicon
        run: uv run python scripts/build_nst_lexicon.py build

      - name: Test at ${{ matrix.tz }}
        run: uv run pytest -n auto --no-cov
        env:
          TZ: ${{ matrix.tz }}

  # Runs the backend suite at a deliberately hostile HOUR — the axis no other
  # gate covers. `backend-hostile-tz` varies the offset; this varies the local
  # clock, and they are orthogonal.
  #
  # THE TRICK: the danger band is a LOCAL wall-clock band, so a timezone can put
  # us inside it on demand. A fixture that stamps `last_review` / `introduced_at`
  # / `revlog.id` relative to `datetime.now()` can straddle ANKI_ROLLOVER_HOUR
  # and land in the previous Anki day — but only in [04:00, 05:00) local, one
  # hour a day. Rather than wait for that hour, we compute the offset that makes
  # it be that hour right now: whole-hour zones span UTC-12..UTC+14, so for any
  # UTC hour there is always a zone whose local time is 04:xx.
  #
  # This is `tunatale-vnf.7` option 2 with its own stated weakness removed. A
  # `schedule:` trigger at ~04:30 UTC would also hit the band, but it finds bugs
  # late and off the PR that caused them; this runs on every push, on the diff
  # that introduced the bug, and adds no wall-clock time (parallel, --no-cov).
  #
  # Pinning TZ=UTC everywhere made this WORSE, not better: every gate now shares
  # ONE global danger band instead of differing local ones that might have
  # disagreed and exposed each other. Before this job, the vnf.6 flake was
  # catchable by the whole CI fleet for 1 hour in 24; now it is caught every run.
  #
  # ⚠️ The computed zone necessarily varies with the UTC hour (offset +14..-12
  # across a day), so this job also samples the OFFSET axis — meaning a bug that
  # is offset-specific rather than hour-specific can make it red at some hours
  # and green at others. That is not flakiness to paper over; it is the same
  # class of finding. Verified clean at filing time: the suite passes at all 24
  # local hours, all 27 whole-hour offsets, and 6 fractional-offset zones.
  #
  # ⚠️ CI-only, like `backend-hostile-tz` — ./test.sh does not run it, because a
  # second full suite would double the local gate. Gate parity is `tunatale-as5`.
  #
  # If this goes red while `backend` is green, suspect a fixture doing date
  # arithmetic across ANKI_ROLLOVER_HOUR before suspecting product code. The
  # signature is an off-by-one-day count (`got 1, expected 2`).
  backend-hostile-hour:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    # ⚠️ Required for the lean sync below to STICK, and it must be job-level —
    # a `--no-sync` flag does not propagate to the bare `uv run` the suite
    # shells out to. Full reasoning in the header block (tunatale-ouk.6).
    env:
      UV_NO_SYNC: "1"

    steps:
      - uses: actions/checkout@v7

      # ffmpeg is a hard runtime dep (app/audio/transcode.py,
      # app/cards/media/normalize.py, app/audio/alignment.py) and no test
      # skips without it. Defined ONCE in .github/actions/setup-ffmpeg —
      # five job instances used to each drag the same 94.1 MB dependency
      # closure off an Ubuntu mirror (~470 MB/run) with the step duplicated
      # verbatim in four places.
      - name: Install ffmpeg
        # tunatale-ouk.2: cap the step so a hung mirror cannot eat the job's
        # full 20min and then report as a plain `fail` that reads exactly like
        # a broken build (that misdiagnosis cost real time on 2026-08-18).
        # 6 min, NOT the 2-3 min that issue suggested: the step measured 4m28s
        # on e2e in run 32185315294, so a 3min cap would have reddened CI on
        # the spot. Tighten it once the cache above is landing hits.
        timeout-minutes: 6
        uses: ./.github/actions/setup-ffmpeg
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1  # exact: astral-sh stopped publishing floating major tags after v7 (no v8/v9/v10 alias exists)
        with:
          version: "latest"
          # Same fix as the e2e job below/above, extended to this job: the uv
          # cache key hashes platform + python + LOCKFILE, never the install
          # flags, so `--no-default-groups --group dev` shrank what is INSTALLED
          # while this job kept restoring (and re-saving) the pre-lean 2.5 GB
          # cache. Measured 2026-09-01 over 11 main runs: 2517 MB restored here
          # vs 90 MB in e2e, `Install uv` median 23-39s vs 3s.
          cache-suffix: lean-py

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --no-default-groups --group dev

      # Etc/GMT signs are INVERTED (Etc/GMT-9 is UTC+9), hence the negation.
      # The local-hour assertion is not ceremony: without it a bad offset would
      # silently run the suite at an ordinary hour and report a meaningless
      # green, which is worse than no job at all.
      - name: Resolve a timezone whose local time is inside [04:00, 05:00)
        run: |
          set -euo pipefail
          utc_hour=$(date -u +%-H)
          offset=$(( (4 - utc_hour + 24) % 24 ))
          [ "$offset" -gt 14 ] && offset=$(( offset - 24 ))
          if [ "$offset" -ge 0 ]; then tz="Etc/GMT-$offset"; else tz="Etc/GMT+$(( -offset ))"; fi
          local_hour=$(TZ="$tz" date +%-H)
          echo "UTC hour $utc_hour -> offset $offset -> $tz -> local hour $local_hour"
          if [ "$local_hour" -ne 4 ]; then
            echo "::error::Resolved $tz gives local hour $local_hour, expected 4 — the probe is broken, not the suite."
            exit 1
          fi
          echo "HOSTILE_TZ=$tz" >> "$GITHUB_ENV"

      - name: Build NST lexicon
        run: uv run python scripts/build_nst_lexicon.py build

      - name: Test at the rollover hour
        run: TZ="$HOSTILE_TZ" uv run pytest -n auto --no-cov

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Format check
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: OpenAPI type check
        run: bun run check:api

      - name: Type check
        run: bun run check

      - name: Unit tests
        run: bun run test:coverage

  # Playwright, which until now ran ONLY on a developer's laptop. It was the
  # largest single hole in the gate: 40 specs — including `cors-lockdown.spec.ts`,
  # the one place a backend header grant and a browser's enforcement of it are
  # observed together — could break on main and no push would say so.
  #
  # This job is what makes "local ⊆ CI" true rather than aspirational
  # (tunatale-as5). Before it, each gate held something the other could not see,
  # so "green" had two meanings and neither contained the other.
  #
  # It needs BOTH toolchains, which is why it is not a step on `frontend`:
  # playwright.config.ts boots four webServers — one uvicorn backend per Playwright
  # worker (:8001, :8003; each serves both languages through its per-language
  # connection map) and one Vite per worker (:5174, :5175) — so
  # uv, Python and the backend dependency set all have to be present alongside bun. Its own job keeps that cost off `frontend`
  # and runs it in parallel, adding no wall-clock to the fleet.
  #
  # ffmpeg is installed because the backends are the real app; `anki-gates`
  # deliberately omits it (neither of its two gates touches the audio pipeline).
  #
  # The lemmatizer groups stay EXCLUDED here and the suite still passes because
  # the config pins `lemmatizer_type: lowercase` — E2E does not test lemmatization
  # and classla's ~26s model load would blow the 30s webServer timeout. That pin
  # is why this job does not reopen the dependency-split question.
  #
  # ⚠️ Expect this to be the flakiest job in the fleet, and do NOT reach for
  # `retries` when it is. See playwright.config.ts for why retries are 0 and what
  # a red here is allowed to mean (tunatale-vnf.3 is a known, open, possibly-real
  # bug). Read the uploaded trace before concluding "CI is just flaky".
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # ⚠️ THE FLAG THAT MAKES THE LEAN SYNC BELOW STICK. `uv run` re-syncs to
    # `[tool.uv] default-groups` implicitly, which is why the `--no-group` flags
    # deleted in tunatale-as5 were inert — something later ran `uv run` and put
    # torch straight back. Playwright's webServer starts the backend with
    # `uv run uvicorn` (frontend/playwright.config.ts), so without this the sync
    # below would be undone before the first spec. Set as an env var rather than
    # editing that command, so LOCAL e2e runs are unaffected: a developer's
    # environment stays full-fat with no flags to remember.
    env:
      UV_NO_SYNC: "1"

    steps:
      - uses: actions/checkout@v7

      # ffmpeg is a hard runtime dep (app/audio/transcode.py,
      # app/cards/media/normalize.py, app/audio/alignment.py) and no test
      # skips without it. Defined ONCE in .github/actions/setup-ffmpeg —
      # five job instances used to each drag the same 94.1 MB dependency
      # closure off an Ubuntu mirror (~470 MB/run) with the step duplicated
      # verbatim in four places.
      - name: Install ffmpeg
        # tunatale-ouk.2: cap the step so a hung mirror cannot eat the job's
        # full 20min and then report as a plain `fail` that reads exactly like
        # a broken build (that misdiagnosis cost real time on 2026-08-18).
        # 6 min, NOT the 2-3 min that issue suggested: the step measured 4m28s
        # on e2e in run 32185315294, so a 3min cap would have reddened CI on
        # the spot. Tighten it once the cache above is landing hits.
        timeout-minutes: 6
        uses: ./.github/actions/setup-ffmpeg
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1  # exact: astral-sh stopped publishing floating major tags after v7 (no v8/v9/v10 alias exists)
        with:
          version: "latest"
          # A SEPARATE CACHE SCOPE, and it is the point of this change rather
          # than an optimisation of it. setup-uv caches ~/.cache/uv keyed on the
          # lockfile, so every job restores the same 2.5 GB of wheels — torch
          # included — and pays ~21s doing it (~10s transfer, ~10s untar;
          # measured 103s/job on a slow day, see backend/pyproject.toml). The
          # group flags below cannot shrink that: the cache holds what the LOCK
          # resolves, not what the job installs. A distinct suffix gives e2e its
          # own cache containing only what it actually syncs.
          cache-suffix: lean-e2e

      - name: Set up Python
        run: uv python install 3.14

      # E2E DELIBERATELY DIVERGES FROM THE OTHER JOBS, and only this job does.
      # The three heavy groups exist for lemmatization (classla/stanza) and
      # forced alignment (transformers -> torch). E2E exercises neither, and
      # already says so: playwright.config.ts pins `lemmatizer_type: lowercase`
      # so the backend does not pay classla's ~26s model load and blow the
      # webServer timeout.
      #
      # Safe because every heavy import is LAZY and gated:
      #   - app/srs/lemmatizer.py imports classla/stanza inside _ensure_pipeline
      #     and behind `if engine == "classla"`, so `lowercase` never touches them
      #   - app/plugins/languages/no/alignment.py imports torch inside a function,
      #     behind app.audio.slicer.alignment_installed(), a find_spec gate that
      #     degrades rather than raising
      #   - no spec calls a slicing or alignment endpoint (checked: every "slice"
      #     in frontend/tests is Array.prototype.slice)
      #
      # ⚠️ If a spec ever needs real lemmatization or slicing, this is what will
      # have broken it — restore --all-groups here rather than adding the
      # packages back some other way. The backend/pytest jobs keep --all-groups
      # on purpose, so nothing about the tested environment changes for them.
      - name: Install backend dependencies (lean — no lemmatizers, no torch)
        working-directory: backend
        run: uv sync --no-group slovene --no-group norwegian --no-group alignment

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # `GET /api/health` probes audio_dir and media_dir by creating and removing
      # a real file in each (os.access answers from permission bits and would
      # report success on a read-only mount). Both default under backend/ —
      # `media/` and `output/audio/` — and BOTH ARE GITIGNORED WITH ZERO TRACKED
      # FILES, so they exist on every developer's disk and in no fresh checkout.
      #
      # Without this step the backend boots fine and answers 503, which failed
      # three specs on this job's first run: the two smoke health checks and
      # `cors-lockdown`, whose allowlisted-origin case asserts 200 and got 503.
      # That is a genuine environment-parity defect, not test noise — the local
      # gate passed only because of untracked local state, and nothing could see
      # it while Playwright ran on laptops only.
      #
      # Provisioning here rather than auto-creating them at startup is deliberate:
      # a mkdir in the app's lifespan would happily create a plain directory where
      # a volume failed to mount, turning the exact "unmounted volume reads green"
      # bug that `app/api/health.py` documents it exists to prevent back into a
      # silent pass. A deployment must provision these; so must CI. The open
      # question of who does that for a real deploy is `tunatale-kbb.7`.
      - name: Provision the gitignored content directories
        run: mkdir -p backend/media backend/output/audio

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install

      # ── The SECOND route to the sick apt mirror (tunatale-ouk.5) ───────────
      # `--with-deps` is two jobs in one command: an apt install of Chromium's
      # system libraries, and a browser download from cdn.playwright.dev. Only
      # the apt half is a problem, so the two are split below and cached
      # separately.
      #
      # Measured on run 32209290580, where the combined step took 88s:
      #   apt           21.1 MB in 1m13s (289 kB/s)   <- 73 of the 88 seconds
      #   the browsers  ~9s from cdn.playwright.dev   <- a healthy host, always fast
      #
      # ⚠️ CACHING THE .deb DOWNLOAD IS NOT ENOUGH, and v1 of this tried exactly
      # that and failed. Run 32278642554 timed out at 6 minutes having banked
      # `cached .debs: 0`, because the hang is one stage EARLIER — in
      # `apt-get update` fetching package indices:
      #
      #   16:56:50  Ign:12..20 azure.archive.ubuntu.com/ubuntu noble-updates/...
      #   16:56:50  Get:5      archive.ubuntu.com noble-security InRelease
      #   17:02:24  ##[error] timed out after 6 minutes      <- 5m33s of silence
      #
      # i.e. it stalls on the indices even AFTER a successful failover — the same
      # signature setup-ffmpeg records. Dir::Cache::archives does not touch that
      # stage, so the cache could never seed: update hangs, no .deb is fetched,
      # nothing is banked, repeat forever.
      #
      # THE ONLY MECHANISM THAT HAS SURVIVED THIS MIRROR IS NOT RUNNING apt AT
      # ALL. In that same run, Install ffmpeg took 10s on a hit because it uses
      # dpkg against cached .debs. So the warm path here does the same, and
      # `playwright install` (browsers only) never shells out to apt.
      # Computed in a step, not inline: ImageOS/ImageVersion are runner PROCESS
      # env vars, and the `env` context in a `${{ }}` expression only carries what
      # a workflow `env:` block defined — `${{ env.ImageVersion }}` would expand to
      # empty and give every image the same key.
      - name: Compute the Playwright cache key
        id: pw-key
        run: |
          set -euo pipefail
          # bun.lock covers the PLAYWRIGHT version: a bump moves the lock, which
          # moves the key, which refetches both the browsers and the dep list.
          # The image version covers the OTHER axis, which bun.lock cannot see —
          # the 9 apt packages riding this same key are "what is missing from this
          # runner image", so they go stale when the image changes, not when
          # Playwright does. Without it those .debs would be pinned until someone
          # happened to bump a frontend dependency.
          # ⚠️ ORDER IS LOAD-BEARING. bun.lock stays in the PREFIX because a
          # Playwright bump must genuinely invalidate the browsers — restoring a
          # neighbour there would serve the wrong browser build. The image
          # version goes LAST, past the prefix boundary, because it must NOT
          # force a cold install: GitHub runs a mixed fleet (two image versions
          # inside one run, measured on 32285662518), so an exact-only key sends
          # half the jobs to the mirror every time.
          echo "prefix=playwright-${RUNNER_OS}-${RUNNER_ARCH}-${{ hashFiles('frontend/bun.lock') }}-v4-" >> "$GITHUB_OUTPUT"
          echo "value=playwright-${RUNNER_OS}-${RUNNER_ARCH}-${{ hashFiles('frontend/bun.lock') }}-v4-${ImageOS:-noimage}-${ImageVersion:-noversion}" \
            >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browser + apt caches
        id: pw-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ${{ github.workspace }}/.ci-playwright-apt
          # Keyed on the lockfile, which moves whenever @playwright/test does —
          # a bump changes both the browser build and possibly the dep list, so
          # one key covers both dirs. It also moves for unrelated frontend deps,
          # costing an occasional needless refetch: chosen deliberately, because
          # a key that is too FRESH costs one slow run while one that is too
          # STALE silently serves the wrong browser build.
          key: ${{ steps.pw-key.outputs.value }}
          # Restores the newest cache for this bun.lock regardless of runner
          # image, so a fleet rollout cannot force a cold apt install. The exact
          # key still misses, so the save step banks a fresh entry for this
          # image — warm every run, still refreshed per image.
          restore-keys: |
            ${{ steps.pw-key.outputs.prefix }}

      # The apt half, and the half that can hang. On a warm run this issues zero
      # network calls; only a genuine miss reaches the mirror.
      - name: Install Playwright system dependencies
        timeout-minutes: 6
        working-directory: frontend
        env:
          PW_APT_CACHE: ${{ github.workspace }}/.ci-playwright-apt
          CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          sudo mkdir -p "$PW_APT_CACHE/partial"   # apt refuses to download without it

          installed_from_cache=false
          # ⚠️ COMPLETENESS, NOT MERE PRESENCE — and the difference is a real bug
          # that shipped. A partial cache (one .deb banked by a timed-out cold
          # run) satisfied the old `ls *.deb` test; dpkg installed that single
          # package, exited 0, and the step reported success having skipped the
          # other 8 entirely. Run 32290246422 did exactly this: `cached .debs: 1`,
          # `pw deps path: cache-dpkg`, 0s, green. The specs passed only because
          # the runner image already carries most of Chromium's libraries.
          #
          # The marker is written ONLY after a successful cold install, so its
          # presence means "this set is complete" and the count catches a cache
          # that lost files. Anything else falls through to the mirror.
          #
          # Still not gated on cache-hit: a prefix restore reports false while the
          # .debs are present, and requiring "true" would send a warm job to the
          # mirror.
          expected_debs=$(cat "$PW_APT_CACHE/.deb-count" 2>/dev/null || echo 0)
          # find, not ls: `ls *.deb` on an empty dir EXITS NON-ZERO, and under
          # `set -euo pipefail` a failing command substitution aborts the step —
          # which is precisely the genuine cold-start case, on every fresh runner.
          # find reports 0 matches with status 0.
          actual_debs=$(find "$PW_APT_CACHE" -maxdepth 1 -name '*.deb' | wc -l | tr -d ' ')
          if [ "$expected_debs" -gt 0 ] && [ "$actual_debs" = "$expected_debs" ]; then
            # dpkg needs no package lists and no network, which is the whole
            # point — this is the path that a sick mirror cannot reach.
            if sudo dpkg -i "$PW_APT_CACHE"/*.deb; then
              installed_from_cache=true
            else
              # An incomplete closure (newer runner image dropped something that
              # used to be preinstalled) leaves packages unconfigured; clear that
              # before apt runs or apt inherits the broken state.
              sudo dpkg --configure -a || true
              echo "::warning::cached .debs did not satisfy Playwright's deps — falling back to the mirror"
            fi
          fi

          if [ "$installed_from_cache" != "true" ]; then
            # COLD PATH — the only path that touches the mirror. apt reads
            # Dir::Cache::archives from any conf.d file, and Playwright shells
            # out to plain apt-get, so this is how we capture .debs from a
            # command whose arguments we do not control.
            # ⚠️ THE TIMEOUTS ARE NOT DECORATION — WITHOUT THEM THIS PATH CANNOT
            # BOOTSTRAP. Playwright shells out to plain `apt-get`, so it inherits
            # none of the Acquire bounds setup-ffmpeg passes on its command line.
            # Measured on run 32287959161: apt-get update Ign'd every
            # azure.archive.ubuntu.com index, failed over to archive.ubuntu.com,
            # then went SILENT for 5m30s until the step cap killed it — before a
            # single .deb was fetched. So the save-on-failure below had nothing to
            # bank (the main-scoped cache is literally 0 MB), the next run
            # repeated it, and the cache could never seed. A deadlock that only
            # appears while the mirror is sick, i.e. exactly when it matters.
            #
            # A conf.d file is the only way to reach apt here, the same trick the
            # Dir::Cache::archives line below uses. These are the values 90cff2a
            # gave the ffmpeg step.
            #
            # ⚠️ AND THEY ARE NOT SUFFICIENT ON THEIR OWN — tunatale-ouk.5 proved
            # that for ffmpeg: a mirror that trickles bytes never trips an
            # INACTIVITY bound. They fix the observed stall (a dead connection
            # after failover) and buy the cold path a chance to complete; the real
            # protection is still the cache, which makes this path rare.
            printf 'Dir::Cache::archives "%s";\nAcquire::Retries "3";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' \
              "$PW_APT_CACHE" \
              | sudo tee /etc/apt/apt.conf.d/99-ci-playwright-cache > /dev/null
            bunx playwright install-deps chromium
            # Reached only if install-deps exited 0, so the .deb set is complete.
            # This is what makes the warm path above trustworthy.
            # ⚠️ sudo tee, NOT a plain redirect. $PW_APT_CACHE is created with
            # `sudo mkdir` and apt writes into it as root, so the runner user
            # cannot create a file there — a bare `>` dies with "Permission
            # denied" and, under `set -e`, takes the whole step with it. That is
            # not hypothetical: run 32292432808 fetched all 21.1 MB and installed
            # all 9 packages in 2m29s, then failed on this line and threw the
            # result away. The re-own step that would have fixed the ownership
            # runs AFTER this one, which is why it cannot be relied on here.
            find "$PW_APT_CACHE" -maxdepth 1 -name '*.deb' | wc -l | tr -d ' ' \
              | sudo tee "$PW_APT_CACHE/.deb-count" > /dev/null
          fi

          echo "pw_deps_path=$([ "$installed_from_cache" = true ] && echo cache-dpkg || echo mirror-apt)" \
            >> "$GITHUB_ENV"

      # The browser half: cdn.playwright.dev only, never apt. Only chromium —
      # playwright.config.ts declares exactly one project, and pulling the full
      # set would triple the download for browsers no spec opens.
      - name: Install Playwright chromium
        timeout-minutes: 6
        working-directory: frontend
        run: bunx playwright install chromium

      # actions/cache saves as the runner user; apt wrote the .debs as root.
      - name: Re-own the apt cache so it can be saved
        if: always()
        env:
          PW_APT_CACHE: ${{ github.workspace }}/.ci-playwright-apt
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" "$PW_APT_CACHE" || true
          rm -rf "$PW_APT_CACHE/partial"   # root-owned, never worth caching

      # A green run proves nothing here — a healthy mirror and a working cache
      # produce identical logs. `pw deps path: cache-dpkg` is the evidence that
      # this job made no apt request at all, which is the property that matters.
      - name: Report what Playwright cost
        if: always()
        env:
          PW_APT_CACHE: ${{ github.workspace }}/.ci-playwright-apt
        run: |
          echo "cache hit: ${{ steps.pw-cache.outputs.cache-hit || 'false' }}"
          echo "pw deps path: ${pw_deps_path:-unknown}"
          echo "cached .debs: $(ls "$PW_APT_CACHE"/*.deb 2>/dev/null | wc -l)"

      # restore/save split rather than the combined actions/cache@v5: that action does
      # not save when the job fails, so a cold run that dies on the mirror would
      # bank nothing and the cache could never bootstrap. Guarded on cache-hit
      # because the key is immutable and re-saving only logs "already exists".
      # ⚠️ NO LONGER always(). #55 saved on failure so a stalled cold run could
      # bank partial progress and later runs would converge. That idea did not
      # work and actively harmed: the stall is in `apt-get update`, BEFORE any
      # .deb is fetched, so it banked 0 MB and then 3 MB/1 .deb — a cache that
      # looked valid and silently under-installed. Only complete sets are worth
      # keeping; an incomplete one is worse than none.
      - name: Save the Playwright browser + apt caches
        if: steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ${{ github.workspace }}/.ci-playwright-apt
          key: ${{ steps.pw-key.outputs.value }}

      - name: E2E tests
        working-directory: frontend
        run: bun run test:e2e

      # Without this a remote red tells you strictly less than a local re-run
      # would — and a local re-run is exactly what cannot reproduce a CI-only
      # timing failure. `if: failure()` because a green run's report is noise.
      #
      # ⚠️ A CONDITIONAL STEP HIDES ITS ACTION FROM THE DEPRECATION SCAN. The
      # runner only flags an action it actually resolves, so while this was
      # @v4 it was invisible on every green run and the Node 20 annotation
      # appeared only when e2e went red. `actions/cache/save` (guarded on
      # cache-hit) hid the same way. When auditing action versions, read this
      # file — a clean annotation list on a green run proves nothing about
      # steps that green run skipped.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # ⚠️ TWO GATES, ONE JOB (tunatale-ej8.2). These were separate jobs until
  # 2026-09-01 and were byte-identical apart from their final step — same
  # runner, timeout, working-directory, UV_NO_SYNC, checkout, setup-uv,
  # python install, sync, and the same anki warm step, which is now paid once
  # instead of twice.
  #
  # WHY MERGE: job COUNT drives this repo's CI tail, not job duration. The
  # tunatale-ouk profile found three runs at 586s / 706s / 936s whose MAX JOB
  # was only 125s / 166s / 126s — no job was slow, the jobs simply did not all
  # get runners at once and serialized. This removes a job without removing a
  # test.
  #
  # WHY IT IS FREE: measured post-lean-cache on run 33518636535, oracle-parity
  # was 34s and peer-sync 33s against e2e's 113s, which is the pole. Serialised
  # they are ~57s (~10s shared setup + ~24s + ~23s), still well under the pole,
  # so total CI ≈ MAX(job) does not move.
  #
  # ⚠️ DO NOT EXTEND THIS TO THE backend-* JOBS. They look similarly duplicative
  # and are not: they run the same suite under DIFFERENT ambient clocks, so
  # serialising them would defeat their entire purpose. See the redundancy
  # argument in the comment block above `backend-hostile-tz`.
  anki-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    # ⚠️ Required for the lean sync below to STICK, and it must be job-level —
    # a `--no-sync` flag does not propagate to the bare `uv run` the suite
    # shells out to. Full reasoning in the header block (tunatale-ouk.6).
    env:
      UV_NO_SYNC: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1  # exact: astral-sh stopped publishing floating major tags after v7 (no v8/v9/v10 alias exists)
        with:
          version: "latest"
          # Same fix as the e2e job above: the uv cache key hashes platform +
          # python + LOCKFILE, never the install flags, so
          # `--no-default-groups --group dev` shrank what is INSTALLED while
          # this job kept restoring (and re-saving) the pre-lean 2.5 GB cache.
          # Measured 2026-09-01 over 11 main runs: 2517 MB restored here vs
          # 90 MB in e2e, `Install uv` median 23-39s vs 3s.
          cache-suffix: lean-py

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --no-default-groups --group dev

      # `id:` is load-bearing — the peer-sync gate keys its `if:` on THIS step,
      # not on the oracle gate, so a failing oracle run still reports peer-sync
      # while a broken SETUP correctly skips it.
      - name: Warm anki subprocess env
        id: warm
        run: uv run --isolated --no-project --python 3.14 --with anki==26.8.1 python -c "import anki"

      - name: Oracle parity gate
        run: uv run pytest -m oracle --run-oracle -n auto --no-cov

      # ⚠️ Runs even when the oracle gate above FAILED. Without this the merge
      # would quietly cost a diagnostic: two jobs always reported on both
      # suites, and a naive single job reports one failure per run. Guarded on
      # the warm step so a setup failure still short-circuits both gates.
      - name: Peer-sync gate
        if: always() && steps.warm.outcome == 'success'
        run: uv run pytest tests/test_anki_peer_sync_selfhost.py --run-peer-sync --no-cov -v
