name: CI

# `push` is narrowed to main ON PURPOSE. Unrestricted, it fired alongside
# `pull_request` for every branch push, so any branch with an open PR got TWO
# complete identical runs of all six jobs — doubling CI minutes on every push.
#
# It was not only waste. On PR #19 the redundant run's `backend` job became a
# zombie (43 minutes without finishing step 1, while the identical job in the
# sibling run passed in 1m57s). `gh pr checks` aggregates across runs, so the PR
# showed a permanent `pending` that read as a hanging test suite rather than a
# dead runner on a run that never needed to exist. One run per push makes that
# unambiguous.
#
# Consequence, accepted deliberately: a branch pushed WITHOUT an open PR now gets
# no CI. Confirmed with the user 2026-08-14 that nothing relies on that.
on:
  push:
    branches: [main]
  pull_request:

# Pinned workflow-wide, to the SAME value test.sh pins, so a future job cannot
# silently reintroduce the divergence by forgetting it. See test.sh for why.
# Exactly TWO jobs deliberately override it, and they are the only ones that
# should: `backend-hostile-tz` (varies the OFFSET) and `backend-hostile-hour`
# (varies the local CLOCK). Reproducibility comes from the pin, tolerance from
# those two — and they are orthogonal, so neither substitutes for the other.
env:
  TZ: UTC

# ⚠️ Every install step is a plain `uv sync --all-groups`, and the `--no-group
# slovene --no-group norwegian --no-group alignment` flags that used to follow it
# were DELETED on 2026-08-14 because they did nothing (tunatale-as5).
#
# They looked like they made CI lean, and `tunatale-as5` was filed on the belief
# that they did — that CI ran without classla/stanza/torch/transformers, so the
# syllable-slicing paths were never exercised for real. Measured, that is false:
# `pyproject.toml` sets `[tool.uv] default-groups = ['dev','slovene','norwegian',
# 'alignment']`, and a bare `uv run` re-syncs the environment to the DEFAULT
# groups before running anything. So the very next step put all of it back.
#
# Proven, not reasoned: after running CI's exact former sync into a throwaway
# env, `find_spec` reported transformers=False torch=False; one bare `uv run`
# then printed `Installed 37 packages` and the same probe reported True/True,
# with `alignment_installed()` flipping to True. The live confirmation is in the
# `e2e` job's own log — the app boots and prints `Syllable slicing enabled for:
# no`, which is guarded by `if slicers:` and therefore cannot print on the empty
# dict the flags were believed to produce.
#
# Net effect of the flags: an extra partial install per job, then a full one.
# They cost time and bought nothing. If you ever want CI to genuinely run lean,
# the flags are not the lever — `default-groups` or `--no-sync` is, and that
# would create a real local/CI divergence to document. See
# `.claude/rules/testing.md` § "What a green gate means".
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      # ffmpeg is a hard runtime dep (app/audio/transcode.py,
      # app/cards/media/normalize.py, app/audio/alignment.py) and no test
      # skips without it. Defined ONCE in .github/actions/setup-ffmpeg —
      # five job instances used to each drag the same 94.1 MB dependency
      # closure off an Ubuntu mirror (~470 MB/run) with the step duplicated
      # verbatim in four places.
      - name: Install ffmpeg
        # tunatale-ouk.2: cap the step so a hung mirror cannot eat the job's
        # full 20min and then report as a plain `fail` that reads exactly like
        # a broken build (that misdiagnosis cost real time on 2026-08-18).
        # 6 min, NOT the 2-3 min that issue suggested: the step measured 4m28s
        # on e2e in run 32185315294, so a 3min cap would have reddened CI on
        # the spot.
        #
        # ⚠️ DO NOT tighten this toward the observed 14-35s. An earlier version
        # of this comment said to, and that was wrong. Those numbers are the
        # WARM path (`Need to get 0 B/62.8 MB`); the cap has to survive the COLD
        # one — a bumped cache key, an evicted cache, a new runner image — which
        # still pulls 62.8 MB and, at the 352 kB/s this mirror has actually been
        # measured serving, takes ~3 minutes. A cap sized to the warm path turns
        # every cache miss into a red build.
        timeout-minutes: 6
        uses: ./.github/actions/setup-ffmpeg
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0  # exact: astral-sh stopped publishing floating major tags after v7 (no v8/v9 alias exists)
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check app tests scripts

      - name: Format check
        run: uv run ruff format --check app tests scripts

      - name: Mock boundary check
        run: uv run python scripts/check_mock_boundaries.py

      - name: Language literal check
        run: uv run python scripts/check_language_literals.py

      - name: Date today check
        run: uv run python scripts/check_date_today.py

      - name: Singular database_url check
        run: uv run python scripts/check_singular_database_url.py

      - name: Plugin import check
        run: uv run python scripts/check_plugin_imports.py

      - name: OpenAPI snapshot check
        run: uv run python scripts/check_openapi_snapshot.py

      - name: Prod env profile check
        run: uv run python scripts/check_prod_env.py

      - name: Test
        run: uv run pytest -n auto

  # Runs the backend suite at a deliberately hostile UTC offset, because pinning
  # TZ everywhere else makes both gates blind to time-zone fragility rather than
  # free of it.
  #
  # This is not hypothetical. A /listen rollover fixture mixed UTC literals with
  # locally-derived Anki-day bounds and failed from UTC+5 eastward; local (-0400)
  # and CI (UTC) both sat inside the passing band, so it survived every gate
  # until someone went looking (tunatale-3oz).
  #
  # UTC+14 and UTC-12 are the two extreme zones that exist, and the matrix is
  # prophylactic symmetric coverage of both — NOT two probes for one failure
  # mode. The extremes did not catch the bug that forced this matrix: a test
  # seeding revlog timestamps at `now`/`now-1h` straddles the 4 AM Anki-day
  # rollover inside [04:00, 05:00) local, a wall-clock flake that hits every
  # timezone for one hour a day. UTC+14 alone missed it only because the run
  # happened to land outside that band; UTC-12 fails the SAME clock hour
  # (tunatale-vnf.6). So the offsets are not the probe — the band is. If this
  # goes red while `backend` is green, the bug is a test encoding a local
  # wall-clock assumption — look for a fixture doing date arithmetic across
  # ANKI_ROLLOVER_HOUR before suspecting product code.
  #
  # ⚠️ THE EXTREMES ARE NOT A MAXIMAL PROBE, and assuming they were hid a real
  # bug. `test_unbury_idempotent_across_midnight_same_anki_day` expressed two
  # LOCAL wall-clock times as UTC literals 3 hours apart; a 4 AM local rollover
  # falls between them only at UTC+2, +3 and +4, so it failed hard at CEST,
  # Moscow and Gulf offsets while passing at BOTH extremes this matrix probes
  # (found 2026-08-14 by a full 27-offset sweep, fixed in the same commit).
  # A mid-range band is invisible to an endpoints-only matrix. Do not widen this
  # matrix reflexively — a full sweep is a local command, not a CI job — but do
  # not read "green here" as "green everywhere" either. The sweep, ~8 min:
  #
  #   cd backend
  #   for o in $(seq -14 12); do
  #     [ "$o" -ge 0 ] && z="Etc/GMT+$o" || z="Etc/GMT-$(( -o ))"
  #     echo "$z $(TZ=$z uv run pytest -n auto --no-cov -q 2>&1 | tail -1)"
  #   done
  #
  # Separate job (not a matrix dimension on `backend`) so it runs in parallel
  # and adds no wall-clock time; --no-cov because `backend` already owns the
  # coverage gate; this job exists to answer one question only.
  backend-hostile-tz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        tz: [Pacific/Kiritimati, Etc/GMT+12]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      # ffmpeg is a hard runtime dep (app/audio/transcode.py,
      # app/cards/media/normalize.py, app/audio/alignment.py) and no test
      # skips without it. Defined ONCE in .github/actions/setup-ffmpeg —
      # five job instances used to each drag the same 94.1 MB dependency
      # closure off an Ubuntu mirror (~470 MB/run) with the step duplicated
      # verbatim in four places.
      - name: Install ffmpeg
        # tunatale-ouk.2: cap the step so a hung mirror cannot eat the job's
        # full 20min and then report as a plain `fail` that reads exactly like
        # a broken build (that misdiagnosis cost real time on 2026-08-18).
        # 6 min, NOT the 2-3 min that issue suggested: the step measured 4m28s
        # on e2e in run 32185315294, so a 3min cap would have reddened CI on
        # the spot. Tighten it once the cache above is landing hits.
        timeout-minutes: 6
        uses: ./.github/actions/setup-ffmpeg
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0  # exact: astral-sh stopped publishing floating major tags after v7 (no v8/v9 alias exists)
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Test at ${{ matrix.tz }}
        run: uv run pytest -n auto --no-cov
        env:
          TZ: ${{ matrix.tz }}

  # Runs the backend suite at a deliberately hostile HOUR — the axis no other
  # gate covers. `backend-hostile-tz` varies the offset; this varies the local
  # clock, and they are orthogonal.
  #
  # THE TRICK: the danger band is a LOCAL wall-clock band, so a timezone can put
  # us inside it on demand. A fixture that stamps `last_review` / `introduced_at`
  # / `revlog.id` relative to `datetime.now()` can straddle ANKI_ROLLOVER_HOUR
  # and land in the previous Anki day — but only in [04:00, 05:00) local, one
  # hour a day. Rather than wait for that hour, we compute the offset that makes
  # it be that hour right now: whole-hour zones span UTC-12..UTC+14, so for any
  # UTC hour there is always a zone whose local time is 04:xx.
  #
  # This is `tunatale-vnf.7` option 2 with its own stated weakness removed. A
  # `schedule:` trigger at ~04:30 UTC would also hit the band, but it finds bugs
  # late and off the PR that caused them; this runs on every push, on the diff
  # that introduced the bug, and adds no wall-clock time (parallel, --no-cov).
  #
  # Pinning TZ=UTC everywhere made this WORSE, not better: every gate now shares
  # ONE global danger band instead of differing local ones that might have
  # disagreed and exposed each other. Before this job, the vnf.6 flake was
  # catchable by the whole CI fleet for 1 hour in 24; now it is caught every run.
  #
  # ⚠️ The computed zone necessarily varies with the UTC hour (offset +14..-12
  # across a day), so this job also samples the OFFSET axis — meaning a bug that
  # is offset-specific rather than hour-specific can make it red at some hours
  # and green at others. That is not flakiness to paper over; it is the same
  # class of finding. Verified clean at filing time: the suite passes at all 24
  # local hours, all 27 whole-hour offsets, and 6 fractional-offset zones.
  #
  # ⚠️ CI-only, like `backend-hostile-tz` — ./test.sh does not run it, because a
  # second full suite would double the local gate. Gate parity is `tunatale-as5`.
  #
  # If this goes red while `backend` is green, suspect a fixture doing date
  # arithmetic across ANKI_ROLLOVER_HOUR before suspecting product code. The
  # signature is an off-by-one-day count (`got 1, expected 2`).
  backend-hostile-hour:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      # ffmpeg is a hard runtime dep (app/audio/transcode.py,
      # app/cards/media/normalize.py, app/audio/alignment.py) and no test
      # skips without it. Defined ONCE in .github/actions/setup-ffmpeg —
      # five job instances used to each drag the same 94.1 MB dependency
      # closure off an Ubuntu mirror (~470 MB/run) with the step duplicated
      # verbatim in four places.
      - name: Install ffmpeg
        # tunatale-ouk.2: cap the step so a hung mirror cannot eat the job's
        # full 20min and then report as a plain `fail` that reads exactly like
        # a broken build (that misdiagnosis cost real time on 2026-08-18).
        # 6 min, NOT the 2-3 min that issue suggested: the step measured 4m28s
        # on e2e in run 32185315294, so a 3min cap would have reddened CI on
        # the spot. Tighten it once the cache above is landing hits.
        timeout-minutes: 6
        uses: ./.github/actions/setup-ffmpeg
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0  # exact: astral-sh stopped publishing floating major tags after v7 (no v8/v9 alias exists)
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-groups

      # Etc/GMT signs are INVERTED (Etc/GMT-9 is UTC+9), hence the negation.
      # The local-hour assertion is not ceremony: without it a bad offset would
      # silently run the suite at an ordinary hour and report a meaningless
      # green, which is worse than no job at all.
      - name: Resolve a timezone whose local time is inside [04:00, 05:00)
        run: |
          set -euo pipefail
          utc_hour=$(date -u +%-H)
          offset=$(( (4 - utc_hour + 24) % 24 ))
          [ "$offset" -gt 14 ] && offset=$(( offset - 24 ))
          if [ "$offset" -ge 0 ]; then tz="Etc/GMT-$offset"; else tz="Etc/GMT+$(( -offset ))"; fi
          local_hour=$(TZ="$tz" date +%-H)
          echo "UTC hour $utc_hour -> offset $offset -> $tz -> local hour $local_hour"
          if [ "$local_hour" -ne 4 ]; then
            echo "::error::Resolved $tz gives local hour $local_hour, expected 4 — the probe is broken, not the suite."
            exit 1
          fi
          echo "HOSTILE_TZ=$tz" >> "$GITHUB_ENV"

      - name: Test at the rollover hour
        run: TZ="$HOSTILE_TZ" uv run pytest -n auto --no-cov

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Format check
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: OpenAPI type check
        run: bun run check:api

      - name: Type check
        run: bun run check

      - name: Unit tests
        run: bun run test:coverage

  # Playwright, which until now ran ONLY on a developer's laptop. It was the
  # largest single hole in the gate: 40 specs — including `cors-lockdown.spec.ts`,
  # the one place a backend header grant and a browser's enforcement of it are
  # observed together — could break on main and no push would say so.
  #
  # This job is what makes "local ⊆ CI" true rather than aspirational
  # (tunatale-as5). Before it, each gate held something the other could not see,
  # so "green" had two meanings and neither contained the other.
  #
  # It needs BOTH toolchains, which is why it is not a step on `frontend`:
  # playwright.config.ts boots two webServers — a uvicorn backend (:8001, serving
  # both languages through its per-language connection map) and Vite (:5174) — so
  # uv, Python and the backend dependency set all have to be present alongside bun. Its own job keeps that cost off `frontend`
  # and runs it in parallel, adding no wall-clock to the fleet.
  #
  # ffmpeg is installed because the backends are the real app; `oracle-parity` and
  # `peer-sync` deliberately omit it (they never touch the audio pipeline).
  #
  # The lemmatizer groups stay EXCLUDED here and the suite still passes because
  # the config pins `lemmatizer_type: lowercase` — E2E does not test lemmatization
  # and classla's ~26s model load would blow the 30s webServer timeout. That pin
  # is why this job does not reopen the dependency-split question.
  #
  # ⚠️ Expect this to be the flakiest job in the fleet, and do NOT reach for
  # `retries` when it is. See playwright.config.ts for why retries are 0 and what
  # a red here is allowed to mean (tunatale-vnf.3 is a known, open, possibly-real
  # bug). Read the uploaded trace before concluding "CI is just flaky".
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # ffmpeg is a hard runtime dep (app/audio/transcode.py,
      # app/cards/media/normalize.py, app/audio/alignment.py) and no test
      # skips without it. Defined ONCE in .github/actions/setup-ffmpeg —
      # five job instances used to each drag the same 94.1 MB dependency
      # closure off an Ubuntu mirror (~470 MB/run) with the step duplicated
      # verbatim in four places.
      - name: Install ffmpeg
        # tunatale-ouk.2: cap the step so a hung mirror cannot eat the job's
        # full 20min and then report as a plain `fail` that reads exactly like
        # a broken build (that misdiagnosis cost real time on 2026-08-18).
        # 6 min, NOT the 2-3 min that issue suggested: the step measured 4m28s
        # on e2e in run 32185315294, so a 3min cap would have reddened CI on
        # the spot. Tighten it once the cache above is landing hits.
        timeout-minutes: 6
        uses: ./.github/actions/setup-ffmpeg
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0  # exact: astral-sh stopped publishing floating major tags after v7 (no v8/v9 alias exists)
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --all-groups

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # `GET /api/health` probes audio_dir and media_dir by creating and removing
      # a real file in each (os.access answers from permission bits and would
      # report success on a read-only mount). Both default under backend/ —
      # `media/` and `output/audio/` — and BOTH ARE GITIGNORED WITH ZERO TRACKED
      # FILES, so they exist on every developer's disk and in no fresh checkout.
      #
      # Without this step the backend boots fine and answers 503, which failed
      # three specs on this job's first run: the two smoke health checks and
      # `cors-lockdown`, whose allowlisted-origin case asserts 200 and got 503.
      # That is a genuine environment-parity defect, not test noise — the local
      # gate passed only because of untracked local state, and nothing could see
      # it while Playwright ran on laptops only.
      #
      # Provisioning here rather than auto-creating them at startup is deliberate:
      # a mkdir in the app's lifespan would happily create a plain directory where
      # a volume failed to mount, turning the exact "unmounted volume reads green"
      # bug that `app/api/health.py` documents it exists to prevent back into a
      # silent pass. A deployment must provision these; so must CI. The open
      # question of who does that for a real deploy is `tunatale-kbb.7`.
      - name: Provision the gitignored content directories
        run: mkdir -p backend/media backend/output/audio

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install

      # ── The SECOND route to the sick apt mirror (tunatale-ouk.5) ───────────
      # `--with-deps` is an apt install: it pulls 9 packages / 21.1 MB of
      # Chromium's system libraries on EVERY run, and those are genuinely absent
      # from the runner image, so it cannot simply be dropped. Measured on run
      # 32209290580, where this step took 88s:
      #
      #   apt fetch    21.1 MB in 1m13s (289 kB/s)   <- 73 of the 88 seconds
      #   the browsers  ~9s from cdn.playwright.dev  <- consistently fast
      #
      # So the browser download was never the problem and caching it alone would
      # not have helped; the apt half is where the stalls live, at the same
      # degraded mirror rate the ffmpeg action documents. This step also had NO
      # timeout of its own, so a bad enough stall rode the job's full 20 minutes
      # — which is exactly how run 32275195979 died.
      # restore/save split rather than actions/cache@v4, and that is load-bearing
      # right now: the combined action does not save when the job fails, so with
      # the 6-minute cap below a COLD run against a sick mirror would die before
      # seeding anything and the cache could never bootstrap. Saving with
      # `if: always()` banks whatever .debs did arrive, and apt tops up the rest
      # next run — so even a stalling mirror converges instead of deadlocking.
      - name: Restore the Playwright browser + apt caches
        id: pw-cache
        uses: actions/cache/restore@v4
        with:
          # Two dirs, one key: the browsers Playwright downloads from its CDN,
          # and the .debs `--with-deps` drags off the Ubuntu mirror. They are
          # invalidated by the same thing (a Playwright version bump changes both
          # the browser build and, occasionally, the dep list), so splitting them
          # would only add a second key to keep in sync.
          path: |
            ~/.cache/ms-playwright
            ${{ github.workspace }}/.ci-playwright-apt
          # Keyed on the lockfile, which moves whenever @playwright/test does.
          # It also moves for unrelated frontend deps, costing an occasional
          # needless refetch — accepted deliberately over parsing a version out
          # of package.json, because a key that is merely too fresh is safe and a
          # key that is too stale silently serves the wrong browser build.
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/bun.lock') }}-v1

      # apt reads Dir::Cache::archives from any conf.d file, and Playwright shells
      # out to plain `apt-get`. Setting it globally is what lets us cache a fetch
      # we do not control the command line of — on a hit apt finds every .deb
      # already present and reports `Need to get 0 B`, so the 21.1 MB never
      # crosses the network.
      - name: Point apt at the cached archive directory
        run: |
          set -euo pipefail
          sudo mkdir -p "$PW_APT_CACHE/partial"   # apt refuses to download without partial/
          printf 'Dir::Cache::archives "%s";\n' "$PW_APT_CACHE" \
            | sudo tee /etc/apt/apt.conf.d/99-ci-playwright-cache > /dev/null
        env:
          PW_APT_CACHE: ${{ github.workspace }}/.ci-playwright-apt

      # Only chromium: playwright.config.ts declares exactly one project. Pulling
      # the full browser set would triple the download for browsers no spec opens.
      #
      # ⚠️ The cap is a BACKSTOP, not the fix — bounding a hang only converts it
      # into a faster red, which is why the cache above exists. 6 minutes matches
      # the ffmpeg step and must clear a genuine miss: the browsers are ~9s from
      # the CDN and the deps 21.1 MB, which at the 289 kB/s this mirror has been
      # measured serving is ~73s. Do not tighten it toward the warm path.
      - name: Install Playwright chromium
        timeout-minutes: 6
        working-directory: frontend
        run: bunx playwright install --with-deps chromium

      # actions/cache saves as the runner user; apt wrote the .debs as root.
      - name: Re-own the apt cache so it can be saved
        if: always()
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" "$PW_APT_CACHE" || true
          rm -rf "$PW_APT_CACHE/partial"   # root-owned, and never worth caching
        env:
          PW_APT_CACHE: ${{ github.workspace }}/.ci-playwright-apt

      # Same discipline as the ffmpeg step: a green run proves nothing here,
      # because a healthy mirror and a working cache produce identical logs. This
      # line is the evidence — on a warm run it must read `Need to get 0 B`.
      - name: Report what Playwright cost
        if: always()
        run: |
          echo "browser+apt cache hit: ${{ steps.pw-cache.outputs.cache-hit || 'false' }}"
          echo "cached .debs: $(ls "$PW_APT_CACHE"/*.deb 2>/dev/null | wc -l)"
          echo "browsers on disk: $(ls ~/.cache/ms-playwright 2>/dev/null | tr '\n' ' ')"
        env:
          PW_APT_CACHE: ${{ github.workspace }}/.ci-playwright-apt

      # Skipped on a hit because the key is immutable — re-saving it would only
      # log "cache already exists". On a miss this runs even if the install
      # failed, which is the bootstrap path described above.
      - name: Save the Playwright browser + apt caches
        if: always() && steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ${{ github.workspace }}/.ci-playwright-apt
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/bun.lock') }}-v1

      - name: E2E tests
        working-directory: frontend
        run: bun run test:e2e

      # Without this a remote red tells you strictly less than a local re-run
      # would — and a local re-run is exactly what cannot reproduce a CI-only
      # timing failure. `if: failure()` because a green run's report is noise.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  oracle-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0  # exact: astral-sh stopped publishing floating major tags after v7 (no v8/v9 alias exists)
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Warm anki subprocess env
        run: uv run --isolated --no-project --python 3.14 --with anki==26.5 python -c "import anki"

      - name: Oracle parity gate
        run: uv run pytest -m oracle --run-oracle -n auto --no-cov

  peer-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0  # exact: astral-sh stopped publishing floating major tags after v7 (no v8/v9 alias exists)
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Warm anki subprocess env
        run: uv run --isolated --no-project --python 3.14 --with anki==26.5 python -c "import anki"

      - name: Peer-sync gate
        run: uv run pytest tests/test_anki_peer_sync_selfhost.py --run-peer-sync --no-cov -v
