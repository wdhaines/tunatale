name: Setup ffmpeg
description: >
  Install ffmpeg, reusing the Actions cache so the 94 MB dependency closure is
  fetched from an Ubuntu mirror once rather than once per job instance.

runs:
  using: composite
  steps:
    # ── Why this action exists ──────────────────────────────────────────────
    # Measured on run 32185315294, per job instance:
    #
    #   apt-get update      11.3 MB in 1s   (7.8-11.2 MB/s)
    #   the install fetch   94.1 MB in 1m48s - 4m28s  (352-874 kB/s)
    #
    # So `apt-get update` was never the cost, despite tunatale-ouk.1 naming it
    # as such — the cost is 94.1 MB of ffmpeg's DEPENDENCY CLOSURE dragged off
    # an archive mirror at a rate that varies 2.5x between jobs in the same run.
    # Five job instances install ffmpeg (backend, backend-hostile-tz x2,
    # backend-hostile-hour, e2e), so a run moved ~470 MB over that slow link.
    #
    # The bytes are not really the problem; the MIRROR is. Anything that moves
    # them over GitHub's own network instead wins, which is what the cache does.
    # ⚠️ THE KEY IS COMPUTED IN A STEP, NOT INLINE, because ImageOS/ImageVersion
    # are runner PROCESS env vars — the `env` context in a `${{ }}` expression
    # only carries what a workflow `env:` block defined, so `${{ env.ImageVersion }}`
    # would silently expand to empty and give every image the same key. bash sees
    # the real values.
    - name: Compute the cache key
      id: key
      shell: bash
      run: |
        set -euo pipefail
        # Why the IMAGE version and not the ffmpeg version: the original key
        # carried no version at all, on the reasoning that "nobody knows the
        # package version before asking apt" — which is true, and asking apt is
        # exactly the network round trip this action exists to avoid. The image
        # version answers a better question anyway. What is cached is the set of
        # .debs MISSING FROM THIS RUNNER IMAGE, so the closure is only valid for
        # the image it was computed on; when GitHub ships a new one, a cached
        # closure can be incomplete. That was previously caught at runtime by the
        # dpkg fallback below. Keying on it makes the same condition a clean cache
        # miss instead.
        #
        # It also fixes an unintended side effect of moving to dpkg: apt used to
        # re-resolve ffmpeg every run, so a mirror-side version bump was picked up
        # for free. dpkg installs exactly the bytes it is handed, which pinned CI
        # at whatever version was cached, indefinitely. Now it refreshes whenever
        # the image does — roughly every week or two.
        #
        # ⚠️ THE COST, STATED SO IT IS NOT DISCOVERED THE HARD WAY: each image bump
        # is one COLD run per job, i.e. renewed exposure to the apt mirror that
        # tunatale-ouk.5 was about. That exposure is bounded by the step's 6-minute
        # cap and self-heals on the next run. The trade is deliberate: a permanently
        # pinned, possibly-stale closure was the alternative.
        echo "value=ffmpeg-apt-${RUNNER_OS}-${RUNNER_ARCH}-${ImageOS:-noimage}-${ImageVersion:-noversion}-v2" \
          >> "$GITHUB_OUTPUT"

    - name: Restore the ffmpeg package cache
      id: apt-cache
      uses: actions/cache@v4
      with:
        # ⚠️ ABSOLUTE, via github.workspace, and that is load-bearing. Every job
        # here sets `defaults.run.working-directory: backend`, while
        # actions/cache resolves a relative `path:` against the WORKSPACE ROOT.
        # A relative path would therefore have apt writing .debs into
        # backend/.ci-apt-cache while the cache saved an empty
        # <workspace>/.ci-apt-cache — a permanent cache miss that looks
        # exactly like a working cache, reporting a hit and re-downloading
        # 94 MB every run. Composite-action steps inheriting the job's
        # working-directory is ambiguous enough that it is not worth relying
        # on in either direction; absolute paths make the question moot.
        path: ${{ github.workspace }}/.ci-apt-cache
        # Bump the trailing -vN in the step above to force a refetch by hand.
        # The key now also carries the runner image, so it refreshes on its own —
        # see that step for why the IMAGE version stands in for the package
        # version, and what that costs.
        key: ${{ steps.key.outputs.value }}

    - name: Install ffmpeg
      shell: bash
      env:
        CACHE_DIR: ${{ github.workspace }}/.ci-apt-cache
        CACHE_HIT: ${{ steps.apt-cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        # apt needs `partial/` to exist inside its archive dir or it refuses to
        # download at all — this is the step's one non-obvious requirement.
        sudo mkdir -p "$CACHE_DIR/partial"

        # ── WARM PATH: no network at all (tunatale-ouk.5) ────────────────────
        # A cache hit already holds the ENTIRE dependency closure as .debs — the
        # hit-path logs have read `Need to get 0 B/62.8 MB of archives` since the
        # cache landed, i.e. the install downloads nothing. The only reason the
        # old code still contacted the mirror was `apt-get update`, needed solely
        # so apt could map the name `ffmpeg` onto those filenames.
        #
        # dpkg needs no such mapping: it installs the files it is handed. So the
        # warm path now issues zero network calls, which is what makes a sick
        # mirror unable to affect it. That matters because bounding the
        # CONNECTION (90cff2a) provably was not enough — a mirror that trickles
        # bytes never trips an inactivity timeout, and on 2026-08-19 `update`
        # hung ~370s on the package indices AFTER successfully failing over for
        # InRelease. That run killed all five ffmpeg jobs at once.
        installed_from_cache=false
        if [ "${CACHE_HIT:-false}" = "true" ] && ls "$CACHE_DIR"/*.deb >/dev/null 2>&1; then
          if sudo dpkg -i "$CACHE_DIR"/*.deb; then
            installed_from_cache=true
          else
            # The closure is complete only for the runner image it was built on.
            # If a newer image dropped something that used to be preinstalled,
            # dpkg leaves packages unpacked-but-unconfigured; clear that before
            # apt runs, or apt inherits the broken state and fails too.
            sudo dpkg --configure -a || true
            echo "::warning::cached .debs did not satisfy ffmpeg — falling back to the mirror"
          fi
        fi

        # ── COLD PATH: the only path that touches the mirror ─────────────────
        # Runs on a genuine miss (key bump, eviction, new runner image) and on a
        # warm-path failure. It is deliberately unchanged, including the
        # per-connection timeouts.
        #
        # ⚠️ Do NOT tighten the step's 6-minute cap onto this. It must stay wide
        # enough for a MISS to pull 94.1 MB at the 352-874 kB/s this mirror has
        # been measured serving (tunatale-ouk / 2dfa191), and the slowest
        # SUCCESSFUL install measured to date is 208s against that 372s cap —
        # only 1.8x headroom. A total bound sized to the warm path converts an
        # intermittent failure into a deterministic one.
        if [ "$installed_from_cache" != "true" ]; then
          sudo apt-get update -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15

          # Dir::Cache::archives points apt at the cache dir, so whatever it
          # downloads here is what actions/cache saves for the next run's warm
          # path.
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            -o Dir::Cache::archives="$CACHE_DIR" ffmpeg
        fi

        # Both paths converge here, and both are verified by the libopus check in
        # the next step — there is no path that installs ffmpeg without proving
        # it works.
        echo "install_path=$([ "$installed_from_cache" = true ] && echo cache-dpkg || echo mirror-apt)" \
          >> "$GITHUB_ENV"

        # actions/cache saves as the runner user; apt wrote these as root.
        sudo chown -R "$(id -u):$(id -g)" "$CACHE_DIR"
        rm -rf "$CACHE_DIR/partial"   # never worth caching, and it is root-owned

    - name: Report what this cost
      shell: bash
      env:
        CACHE_DIR: ${{ github.workspace }}/.ci-apt-cache
      run: |
        echo "cache hit: ${{ steps.apt-cache.outputs.cache-hit || 'false' }}"
        # install_path=cache-dpkg means this job made ZERO requests to the apt
        # mirror. That is the property tunatale-ouk.5 is about, and it is the one
        # to grep for when asking whether the fix is actually in force — a green
        # run alone proves nothing, because a healthy mirror looks identical.
        echo "install path: ${install_path:-unknown}"
        echo "cached .debs: $(ls "$CACHE_DIR"/*.deb 2>/dev/null | wc -l), $(du -sh "$CACHE_DIR" 2>/dev/null | cut -f1)"
        ffmpeg -version | head -1
        # libopus is what app/audio/transcode.py encodes with, and it is the
        # codec most likely to arrive via Recommends rather than Depends. Fail
        # HERE, with a legible message, rather than inside an audio test.
        ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libopus \
          || { echo "::error::ffmpeg has no libopus encoder — --no-install-recommends dropped it"; exit 1; }
